[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "in-hand-rotation-mjlab"
version = "0.1.0"
description = "In-hand cube rotation task using LEAP hand in MuJoCo with mjlab"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mjlab[cu128]==1.1.1",
    "pyzmq>=25",
    "mujoco==3.5.0",
    "mujoco-warp==3.5.0.2",
    "warp-lang==1.12.0",
    "torch==2.9.0+cu128",
    "scipy==1.16.2",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
